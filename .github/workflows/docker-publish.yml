name: Test and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: phonepe-analyser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="dev"
          if [ -f VERSION ]; then VERSION="$(tr -d '\r\n ' < VERSION)"; fi
          VERSION="${VERSION#v}"
          [ -n "$VERSION" ] || VERSION="dev"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish single image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/snehithgit/phonepe-analyser:latest
            ghcr.io/snehithgit/phonepe-analyser:v${{ steps.version.outputs.value }}
            ghcr.io/snehithgit/phonepe-analyser:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
